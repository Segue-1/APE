plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    //implementation 'net.portswigger.burp.extensions:montoya-api:2025.8'
    implementation 'net.portswigger.burp.extensions:montoya-api:2026.7'
}

// Fat jar. Bundles everything into one self contained jar.
jar {
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
// Standalone harness for the trigger condition parser in Model (src/test/java/ConditionLogicTest.java).
// It is a plain main() with its own assertions, so no test framework is needed on the classpath.
// Run with: ./gradlew conditionLogicTest
tasks.register('conditionLogicTest', JavaExec) {
    group = 'verification'
    description = 'Runs the trigger condition parser logic harness'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ConditionLogicTest'
}

// Standalone harness for the replacement / extraction logic in Model and the start / stop string
// collection in Utils (src/test/java/ReplacementLogicTest.java). Same deal as above, a plain main()
// with its own assertions.
// Run with: ./gradlew replacementLogicTest
tasks.register('replacementLogicTest', JavaExec) {
    group = 'verification'
    description = 'Runs the text replacement and extraction logic harness'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ReplacementLogicTest'
}

// No JUnit on the classpath. The harnesses above are the entry point instead.
test.enabled = false

// Standalone harness for the UI-adjacent logic: the shared "From Selection" derivation, dropdown
// repopulation, and the table models (src/test/java/UiLogicTest.java). Headless so JComboBox and
// JTable can be exercised for real without a display.
// Run with: ./gradlew uiLogicTest
tasks.register('uiLogicTest', JavaExec) {
    group = 'verification'
    description = 'Runs the UI logic and table model harness'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'UiLogicTest'
    systemProperty 'java.awt.headless', 'true'
}

// End-to-end harness against the Python test API in ~/Projects/Test-API (src/test/java/LiveApiTest.java).
// Needs the API running:  python3 ~/Projects/Test-API/api.py
// Skips cleanly (exit 0) when the API is not reachable, so the ordinary build never depends on it.
// Run with: ./gradlew liveApiTest
tasks.register('liveApiTest', JavaExec) {
    group = 'verification'
    description = 'Runs APE end to end over real sockets against the local test API'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'LiveApiTest'
}

// Complex-configuration harness against the Python test API: multi-condition trigger conditions with
// mixed AND/OR and negation, several competing trigger conditions, multi-call corrective sets with
// chained extractions (src/test/java/ComplexScenarioTest.java).
// Needs the API running:  python3 ~/Projects/Test-API/api.py
// Run with: ./gradlew complexScenarioTest
tasks.register('complexScenarioTest', JavaExec) {
    group = 'verification'
    description = 'Runs complex APE configurations end to end against the local test API'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ComplexScenarioTest'
}
